services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"

  website:
    build: ./website
    restart: unless-stopped
    ports:
      - "8080:8080"

  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongodb-data:
